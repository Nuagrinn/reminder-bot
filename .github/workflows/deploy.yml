name: Deploy Reminder Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: reminder-bot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/reminder_bot_vps
          chmod 600 ~/.ssh/reminder_bot_vps

      - name: Deploy on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          VPS_PORT="${VPS_PORT:-22}"
          APP_DIR="${APP_DIR:-/opt/reminder-bot}"
          SERVICE_NAME="${SERVICE_NAME:-reminder-bot.service}"
          ssh -i ~/.ssh/reminder_bot_vps \
            -o StrictHostKeyChecking=accept-new \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "cd '$APP_DIR' && APP_DIR='$APP_DIR' SERVICE_NAME='$SERVICE_NAME' bash scripts/vps-deploy.sh"
